<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141826"/>
      <stop offset="0.55" stop-color="#0B0E17"/>
      <stop offset="1" stop-color="#070910"/>
    </linearGradient>
    <linearGradient id="hairG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171C2C"/>
      <stop offset="1" stop-color="#0A0C13"/>
    </linearGradient>
    <linearGradient id="faceG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#232838"/>
      <stop offset="1" stop-color="#12151F"/>
    </linearGradient>
    <filter id="glowA" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowBig" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
