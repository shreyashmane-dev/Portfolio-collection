<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="iotBg" cx="0.5" cy="0.5" r="0.85">
      <stop offset="0" stop-color="#0C1224"/>
      <stop offset="1" stop-color="#05060B"/>
    </radialGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2138"/>
      <stop offset="1" stop-color="#0B0E1A"/>
    </linearGradient>
    <filter id="iotGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#iotBg)"/>
  <!-- traces -->
  <g stroke="#23407C" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M480 360 H300 L240 300 H80"/><path d="M480 400 H260 L200 460 H60"/>
    <path d="M480 440 H320 L260 560 H100"/><path d="M720 360 H900 L960 300 H1140"/>
    <path d="M720 400 H940 L1000 460 H1160"/><path d="M720 440 H880 L940 560 H1100"/>
    <path d="M560 300 V180 L500 120 V40"/><path d="M640 300 V160 L700 100 V30"/>
    <path d="M560 500 V620 L500 680 V770"/><path d="M640 500 V640 L700 700 V780"/>
  </g>
  <g stroke="#397BFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9" filter="url(#iotGlow)">
    <path d="M480 400 H260 L200 460 H60"/>
    <path d="M720 360 H900 L960 300 H1140"/>
    <path d="M640 300 V160 L700 100 V30"/>
    <path d="M560 500 V620 L500 680 V770"/>
  </g>
  <g fill="#397BFF" filter="url(#iotGlow)">
    <circle cx="60" cy="460" r="5"/><circle cx="1140" cy="300" r="5"/><circle cx="700" cy="30" r="5"/><circle cx="500" cy="770" r="5"/>
  </g>
  <g fill="#23407C">
    <circle cx="80" cy="300" r="5"/><circle cx="100" cy="560" r="5"/><circle cx="1160" cy="460" r="5"/><circle cx="1100" cy="560" r="5"/><circle cx="500" cy="40" r="5"/><circle cx="700" cy="780" r="5"/>
  </g>
  <!-- chip -->
  <rect x="470" y="290" width="260" height="220" rx="10" fill="url(#chip)" stroke="#397BFF" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="492" y="312" width="216" height="176" rx="6" fill="#0A0D18" stroke="#1E2A4C" stroke-width="1.5"/>
  <g fill="#3A4666">
    <rect x="446" y="316" width="24" height="10"/><rect x="446" y="348" width="24" height="10"/><rect x="446" y="380" width="24" height="10"/><rect x="446" y="412" width="24" height="10"/><rect x="446" y="444" width="24" height="10"/><rect x="446" y="476" width="24" height="10"/>
    <rect x="730" y="316" width="24" height="10"/><rect x="730" y="348" width="24" height="10"/><rect x="730" y="380" width="24" height="10"/><rect x="730" y="412" width="24" height="10"/><rect x="730" y="444" width="24" height="10"/><rect x="730" y="476" width="24" height="10"/>
  </g>
  <g font-family="monospace" fill="#6FA8FF">
    <text x="600" y="386" font-size="26" text-anchor="middle" letter-spacing="3">ESP32</text>
    <text x="600" y="416" font-size="13" text-anchor="middle" fill="#4A5A86" letter-spacing="2">IOT.CORE // v2.1</text>
  </g>
  <!-- wifi waves -->
  <g stroke="#397BFF" stroke-width="3" fill="none" opacity="0.8" filter="url(#iotGlow)">
    <path d="M572 344 A40 40 0 0 1 628 344"/><path d="M582 354 A26 26 0 0 1 618 354"/>
  </g>
  <circle cx="600" cy="362" r="4" fill="#397BFF"/>
