  <rect x="820" y="600" width="240" height="110" rx="8" fill="#080B14" stroke="#23407C" stroke-width="2"/>
  <path d="M836 668 L866 668 L880 636 L898 688 L914 652 L930 668 L1044 668" stroke="#397BFF" stroke-width="2.5" fill="none" filter="url(#iotGlow)"/>
  <g font-family="monospace" font-size="12" fill="#4A5A86"><text x="836" y="624">SENSOR.STREAM</text></g>
  <!-- water drop -->
  <path d="M180 620 C180 620 148 664 148 688 A32 32 0 0 0 212 688 C212 664 180 620 180 620 Z" fill="none" stroke="#397BFF" stroke-width="2.5" opacity="0.8" filter="url(#iotGlow)"/>
