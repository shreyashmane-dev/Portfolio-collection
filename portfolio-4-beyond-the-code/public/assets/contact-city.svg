<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060A"/>
      <stop offset="0.6" stop-color="#0B0F1E"/>
      <stop offset="1" stop-color="#131A30"/>
    </linearGradient>
    <linearGradient id="cTower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141A2E"/>
      <stop offset="1" stop-color="#0A0D18"/>
    </linearGradient>
    <pattern id="cWin" width="16" height="22" patternUnits="userSpaceOnUse">
      <rect x="4" y="5" width="5" height="7" fill="#8FB2FF" opacity="0.4"/>
      <rect x="11" y="14" width="5" height="6" fill="#FFD9A0" opacity="0.2"/>
    </pattern>
    <linearGradient id="cFog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E1326" stop-opacity="0"/>
      <stop offset="1" stop-color="#08090C" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10131E"/>
      <stop offset="1" stop-color="#05060B"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#BFD4FF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#397BFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="cGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#cSky)"/>
  <circle cx="420" cy="170" r="90" fill="#DDE6FF" opacity="0.16"/>
  <circle cx="420" cy="170" r="56" fill="#E8EEFF" opacity="0.5"/>
  <g fill="url(#cTower)">
    <rect x="0" y="280" width="90" height="420"/><rect x="100" y="200" width="70" height="500"/>
    <rect x="180" y="320" width="100" height="380"/><rect x="300" y="150" width="80" height="550"/>
    <rect x="390" y="260" width="64" height="440"/><rect x="470" y="100" width="90" height="600"/>
    <rect x="580" y="230" width="70" height="470"/><rect x="660" y="310" width="110" height="390"/>
    <rect x="790" y="170" width="76" height="530"/><rect x="880" y="250" width="60" height="450"/>
    <rect x="950" y="120" width="88" height="580"/><rect x="1050" y="280" width="70" height="420"/>
    <rect x="1130" y="200" width="96" height="500"/><rect x="1240" y="300" width="70" height="400"/>
    <rect x="1320" y="160" width="84" height="540"/><rect x="1420" y="240" width="70" height="460"/>
    <rect x="1500" y="320" width="100" height="380"/>
  </g>
  <g fill="url(#cWin)">
    <rect x="108" y="212" width="54" height="470"/><rect x="308" y="162" width="64" height="520"/>
    <rect x="478" y="112" width="74" height="570"/><rect x="798" y="182" width="60" height="500"/>
    <rect x="958" y="132" width="72" height="550"/><rect x="1138" y="212" width="80" height="470"/>
    <rect x="1328" y="172" width="68" height="510"/><rect x="1428" y="252" width="54" height="430"/>
  </g>
  <g stroke="#141A2E" stroke-width="4">
    <line x1="515" y1="100" x2="515" y2="40"/><line x1="994" y1="120" x2="994" y2="56"/><line x1="1362" y1="160" x2="1362" y2="104"/>
  </g>
  <g fill="#FF304F" filter="url(#cGlow)">
    <circle cx="515" cy="38" r="4"/><circle cx="994" cy="54" r="4"/><circle cx="1362" cy="102" r="4"/>
  </g>
  <rect y="480" width="1600" height="240" fill="url(#cFog)"/>
  <!-- elevated highway -->
  <path d="M-40 780 C400 700 1200 700 1640 780 L1640 900 L-40 900 Z" fill="url(#road)"/>
  <path d="M-40 780 C400 700 1200 700 1640 780" stroke="#2A3350" stroke-width="4" fill="none"/>
  <path d="M-40 806 C400 728 1200 728 1640 806" stroke="#397BFF" stroke-width="2" fill="none" opacity="0.4"/>
  <g stroke="#1A2033" stroke-width="10">
    <line x1="240" y1="752" x2="240" y2="900"/><line x1="800" y1="716" x2="800" y2="900"/><line x1="1360" y1="752" x2="1360" y2="900"/>
  </g>
  <!-- street lamps -->
  <g>
    <g stroke="#1E2540" stroke-width="5" fill="none">
      <path d="M180 760 V600 C180 580 200 574 224 578"/><path d="M700 726 V566 C700 546 720 540 744 544"/><path d="M1220 742 V582 C1220 562 1240 556 1264 560"/>
    </g>
    <circle cx="228" cy="580" r="26" fill="url(#lampGlow)"/><circle cx="228" cy="580" r="5" fill="#DDE8FF" filter="url(#cGlow)"/>
    <circle cx="748" cy="546" r="26" fill="url(#lampGlow)"/><circle cx="748" cy="546" r="5" fill="#DDE8FF" filter="url(#cGlow)"/>
    <circle cx="1268" cy="562" r="26" fill="url(#lampGlow)"/><circle cx="1268" cy="562" r="5" fill="#DDE8FF" filter="url(#cGlow)"/>
  </g>
  <!-- light trails -->
  <g filter="url(#cGlow)" stroke-linecap="round" fill="none">
    <path d="M100 800 C400 736 700 728 900 736" stroke="#FF304F" stroke-width="3" opacity="0.8"/>
    <path d="M700 760 C1000 740 1300 752 1560 790" stroke="#397BFF" stroke-width="3" opacity="0.8"/>
  </g>
</svg>